name: test

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  # Run the test suite on Linux, macOS, and Windows.
  # Linux keeps the existing Python 3.11/3.13/3.14 coverage.
  # macOS and Windows use one Python version each.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # No install step on purpose: the tool is standard library only, and a
      # dependency creeping in should break the build here rather than
      # quietly in someone's clone.
      - name: Run the test suite
        run: python -m unittest discover -s tests -t tests -v

      - name: Check the tool runs end to end
        run: |
          python scripts/touchneedle.py check tests/fixtures/sample.md --offline --out "${{ runner.temp }}/report.md" --json "${{ runner.temp }}/data.json"
          python scripts/touchneedle.py claims tests/fixtures/sample.md --out "${{ runner.temp }}/claims.md"
          python -c "from pathlib import Path; assert '8 reference entries' in Path(r'${{ runner.temp }}/report.md').read_text()"

  # Dev-only tooling, installed here and nowhere else -- the package itself
  # still has zero runtime dependencies, and the `test` job above deliberately
  # installs nothing so a dependency creeping in breaks the build.
  # `ruff check` only, never `ruff format`: see the note in pyproject.toml.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # --group needs pip 25.1+; upgrading is cheaper than debugging a runner
      # image that shipped an older one.
      - name: Install ruff and mypy
        run: |
          python -m pip install --upgrade pip
          pip install --group dev

      - run: ruff check .
      - run: mypy scripts/touchneedle.py

  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Fails if any generated file is stale: the plugin's bundled skill, or a
      # version stamp behind __version__ in scripts/touchneedle.py.
      - name: Plugin skill is in sync
        run: |
          bash scripts/sync-plugin-skill.sh
          if ! git diff --quiet; then
            echo "::error::generated files are stale -- run scripts/sync-plugin-skill.sh and commit"
            git diff --stat
            exit 1
          fi
