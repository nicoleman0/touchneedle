name: test

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  # The matrix exists to hold the README's "Python 3.11+" claim honest: floor,
  # middle, and newest. If you turn on branch protection, pin all of these job
  # names as required checks -- a matrix job that is not listed is not enforced.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # No install step on purpose: the tool is standard library only, and a
      # dependency creeping in should break the build here rather than quietly
      # in someone's clone.
      - name: Run the test suite
        run: python -m unittest discover -s tests -t tests -v

      - name: Check the tool runs end to end
        run: |
          python scripts/touchneedle.py check tests/fixtures/sample.md \
            --offline --out /tmp/report.md --json /tmp/data.json
          python scripts/touchneedle.py claims tests/fixtures/sample.md \
            --out /tmp/claims.md
          grep -q '8 reference entries' /tmp/report.md

  # Dev-only tooling, installed here and nowhere else -- the package itself
  # still has zero runtime dependencies, and the `test` job above deliberately
  # installs nothing so a dependency creeping in breaks the build.
  # `ruff check` only, never `ruff format`: see the note in pyproject.toml.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # --group needs pip 25.1+; upgrading is cheaper than debugging a runner
      # image that shipped an older one.
      - name: Install ruff and mypy
        run: |
          python -m pip install --upgrade pip
          pip install --group dev

      - run: ruff check .
      - run: mypy scripts/touchneedle.py

  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Fails if the plugin's bundled skill has drifted from the canonical root
      # copy, or if the three version numbers disagree.
      - name: Plugin skill is in sync
        run: |
          bash scripts/sync-plugin-skill.sh
          if ! git diff --quiet; then
            echo "::error::plugins/ is stale -- run scripts/sync-plugin-skill.sh and commit"
            git diff --stat
            exit 1
          fi
