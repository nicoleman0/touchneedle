name: pr-title

# Pull requests are squash-merged and the squash title defaults to the pull
# request title, so this string is the commit message that lands on main.
# Checked here rather than left to the merge box, so a contributor sees it
# while there is still time to edit it.
#
# `edited` is the reason this is its own workflow rather than a job in test.yml.
# The default pull_request types do not include it, so a title fixed after a
# red run would never be re-checked and the gate would stay red with nothing
# to push. Re-running the whole test matrix on every title and body edit is
# the price of putting it in test.yml, and it is not worth paying.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      # The title goes through the environment, never straight into the script:
      # it is attacker-controlled text and interpolating it into a shell would
      # be an injection.
      - name: Title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          pattern='^(feat|fix|docs|test|refactor|perf|build|chore|ci|style|revert)(\([a-z0-9 .-]+\))?!?: .+'
          if ! grep -qE "$pattern" <<< "$TITLE"; then
            echo "::error::pull request title must follow Conventional Commits, e.g. 'fix: pin UTF-8 for pandoc output'. See CONTRIBUTING.md."
            echo "got: $TITLE"
            exit 1
          fi
